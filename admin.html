<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding RSVP Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f4ef;color:#30322c;margin:0}
.wrap{max-width:1100px;margin:auto;padding:28px 16px}
.card{background:white;border:1px solid #ddd8cc;padding:22px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:#f3f0e8;padding:18px}
.num{font-size:28px;font-weight:700}
button{padding:11px 16px;border:0;background:#78856c;color:#fff;cursor:pointer;transition:background 0.2s ease, transform 0.1s ease}
button:hover{background:#65715a}
button:active{transform:scale(0.98)}
input{padding:11px;border:1px solid #ccc;width:260px;transition:border-color 0.2s ease}
input:focus{outline:none;border-color:#78856c}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;font-size:13px}
#app{opacity:0;max-height:0;overflow:hidden;transition:opacity 0.5s ease, max-height 0.5s ease;pointer-events:none}
#app.visible{opacity:1;max-height:2000px;pointer-events:auto}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}table{display:block;overflow:auto}}
</style></head><body><div class="wrap">
<div class="card"><h1>Reggie & Angelika — RSVP Dashboard</h1><p>Private admin page. Enter your admin key to load responses.</p><input id="key" type="password" placeholder="Admin key"> <button onclick="load()">Load Dashboard</button><span id="err"></span></div>
<div id="app">
<div class="stats">
<div class="stat"><div>Total invited</div><div class="num" id="total">0</div></div>
<div class="stat"><div>Confirmed seats</div><div class="num" id="confirmed">0</div></div>
<div class="stat"><div>Not attending</div><div class="num" id="declined">0</div></div>
<div class="stat"><div>Pending guests</div><div class="num" id="pending">0</div></div>
</div>
<div class="card"><button onclick="downloadCSV()">Download Guest List / Responses (CSV)</button></div>
<div class="card"><table><thead><tr><th>Guest</th><th>Group</th><th>Status</th><th>Mobile</th><th>Dietary</th><th>Message</th><th>Updated</th></tr></thead><tbody id="rows"></tbody></table></div>
</div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwQ7CgFwziyn98OEKU8AAttB8lXqb-H3y_ONahnaJAoceZLaaIvcZOnFOTGS8o1VwVf/exec";let key="",data=[];
async function api(action){let r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,adminKey:key})});return r.json()}
async function load(){
  key=document.getElementById("key").value;
  document.getElementById("err").textContent=" Loading…";
  try{
    let r=await api("adminData");
    if(!r.ok){document.getElementById("err").textContent=" "+(r.message||"Invalid key");return}
    data=r.rows;
    let appEl = document.getElementById("app");
    appEl.classList.add("visible");
    document.getElementById("err").textContent="";
    let total=data.length,confirmed=data.filter(x=>x.status==="Attending").length,declined=data.filter(x=>x.status==="Not Attending").length;
    document.getElementById("total").textContent=total;
    document.getElementById("confirmed").textContent=confirmed;
    document.getElementById("declined").textContent=declined;
    document.getElementById("pending").textContent=total-confirmed-declined;
    document.getElementById("rows").innerHTML=data.map(x=>`<tr><td>${e(x.name)}</td><td>${e(x.group)}</td><td>${e(x.status)}</td><td>${e(x.mobile)}</td><td>${e(x.dietary)}</td><td>${e(x.message)}</td><td>${e(x.updated)}</td></tr>`).join("")
  }catch(e){document.getElementById("err").textContent=" Connection error"}
}
function e(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function downloadCSV(){let cols=["name","group","status","mobile","dietary","message","updated"];let csv=[cols.join(","),...data.map(x=>cols.map(c=>`"${String(x[c]??"").replaceAll('"','""')}"`).join(","))].join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="wedding-rsvp-responses.csv";a.click()}
</script></body></html>
